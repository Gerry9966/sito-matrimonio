<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Location - Rosanna & Gerardo</title>

  <link rel="stylesheet" href="style.css?v=11">
</head>

<body class="location-page">

  <div class="snow"></div>

  <header class="location-hero">
    <div class="hero">
      <p class="eyebrow">Le nostre location</p>
      <h1>Dove festeggeremo</h1>
      <p class="date">3 Gennaio 2027</p>
    </div>
  </header>

  <main class="location-main">

    <section class="location-intro">
      <p class="decor">❧</p>
      <h2>Le nostre location</h2>
      <p class="decor-line">∞</p>
    </section>

    <section class="locations-grid">

      <div class="venue-card">
        <img src="images/chiesa.png" alt="Parrocchia San Giacomo Apostolo">

        <p class="venue-type">Cerimonia</p>
        <h3>Parrocchia San Giacomo Apostolo</h3>
        <p class="venue-place">📍 Puglianello (BN)</p>

        <a class="map-button" href="https://share.google/rfuNOiydaqNWHg7Dv" target="_blank">
          Apri su Google Maps
        </a>
      </div>

      <div class="venue-card">
        <img src="images/castello.png" alt="Castello di Faicchio">

        <p class="venue-type">Ricevimento</p>
        <h3>Castello di Faicchio</h3>
        <p class="venue-place">📍 Faicchio (BN)</p>

        <a class="map-button" href="https://share.google/RskY58lDI8iFdg5Qx" target="_blank">
          Apri su Google Maps
        </a>
      </div>

    </section>

    <div class="back-home">
      <a href="index.html">← Torna al sito</a>
    </div>

  </main>
